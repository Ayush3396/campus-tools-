{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Campus Item Lending & Exchange System — borrow, lend, and exchange items with fellow students.{% endblock %}">
    <title>{% block title %}Campus Exchange{% endblock %} — CILES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'partials/navbar.html' %}

    <main>
        {% include 'partials/messages.html' %}
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    {% block scripts %}{% endblock %}
</body>
</html>
